name: Local Windows Validation

on:
  pull_request:
    branches:
      - main
      - bravo/integration/modular-build
  workflow_dispatch:

jobs:
  validate-local-windows:
    name: Validate modular build on local Windows runner
    runs-on: [self-hosted, Windows, X64, bravo-system-report]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner context
        run: |
          Write-Host "=== RUNNER CONTEXT ==="
          Write-Host "[INFO] ComputerName: $env:COMPUTERNAME"
          Write-Host "[INFO] UserName: $env:USERNAME"
          Write-Host "[INFO] UserDomain: $env:USERDOMAIN"
          Write-Host "[INFO] Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "[INFO] PowerShell: $($PSVersionTable.PSVersion)"

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

          Write-Host "[INFO] Identity: $($identity.Name)"
          Write-Host "[INFO] IsAdmin: $isAdmin"

      - name: Git diff whitespace check
        run: |
          Write-Host "=== GIT DIFF CHECK ==="

          Set-Location $env:GITHUB_WORKSPACE
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed with code $LASTEXITCODE"
          }

          Write-Host "[OK] Git diff check passed"

      - name: Build modular monolith
        run: |
          Write-Host "=== BUILD MODULAR MONOLITH ==="

          Set-Location $env:GITHUB_WORKSPACE

                    & .\Build-BRAVO-SystemReport.ps1 -Clean -CreateSha512

          if (-not $?) {
            throw "Build failed."
          }

          if (-not (Test-Path -LiteralPath ".\dist\Get-BravoSystemReport.ps1")) {
            throw "Runtime script not found: dist\Get-BravoSystemReport.ps1"
          }

          if (-not (Test-Path -LiteralPath ".\dist\Get-BravoSystemReport.ps1.sha512")) {
            throw "SHA512 file not found: dist\Get-BravoSystemReport.ps1.sha512"
          }

          Write-Host "[OK] Build completed"

      - name: Verify SHA512 matches dist
        run: |
          Write-Host "=== SHA512 VERIFICATION ==="

          Set-Location $env:GITHUB_WORKSPACE

          $scriptPath = ".\dist\Get-BravoSystemReport.ps1"
          $shaPath = ".\dist\Get-BravoSystemReport.ps1.sha512"

          $actualHash = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA512).Hash.Trim()
          $recordedHash = (Get-Content -LiteralPath $shaPath -Raw).Trim()

          if ($actualHash -ne $recordedHash) {
            Write-Host "[ERROR] Actual:   $actualHash"
            Write-Host "[ERROR] Recorded: $recordedHash"
            throw "dist/Get-BravoSystemReport.ps1.sha512 does not match dist/Get-BravoSystemReport.ps1. Rebuild with 'Build-BRAVO-SystemReport.ps1 -CreateSha512' and commit both files together."
          }

          Write-Host "[OK] SHA512 matches"

      - name: Contract change guard (SchemaVersion + CHANGELOG)
        if: github.event_name == 'pull_request'
        run: |
          Write-Host "=== CONTRACT CHANGE GUARD ==="

          Set-Location $env:GITHUB_WORKSPACE

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"

          $changedFiles = git diff --name-only "$baseSha" "$headSha"

          $reportModelChanged = $changedFiles -contains "src/20-ReportModel.ps1"

          if ($reportModelChanged) {
            Write-Host "[INFO] src/20-ReportModel.ps1 changed — контракт \$script:Report міг змінитись."

            $schemaVersionDiff = git diff "$baseSha" "$headSha" -- src/20-ReportModel.ps1 | Select-String -Pattern '^\s*[+-]\s*SchemaVersion\s*='
            $changelogChanged = $changedFiles -contains "CHANGELOG.md"

            if (-not $schemaVersionDiff) {
              throw "src/20-ReportModel.ps1 змінено, але значення SchemaVersion у diff не змінилось. Якщо це зміна контракту \$script:Report — підніміть SchemaVersion (docs/AI_RULES.md п.6). Якщо контракт не змінився — переконайтесь, що diff дійсно не чіпає структуру звіту."
            }

            if (-not $changelogChanged) {
              throw "src/20-ReportModel.ps1 змінено (SchemaVersion піднято), але CHANGELOG.md не оновлено (docs/AI_RULES.md п.6)."
            }

            Write-Host "[OK] SchemaVersion і CHANGELOG.md оновлені разом зі зміною контракту"
          } else {
            Write-Host "[OK] src/20-ReportModel.ps1 не змінювався — перевірка не застосовна"
          }

      - name: PowerShell parser check for dist
        run: |
          Write-Host "=== POWERSHELL PARSER CHECK ==="

          Set-Location $env:GITHUB_WORKSPACE

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "dist\Get-BravoSystemReport.ps1"

          $tokens = $null
          $parseErrors = $null

          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          )

          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-Table Message,Extent -AutoSize
            throw "PowerShell parser check failed."
          }

          Write-Host "[OK] Parser clean"

      - name: Run Pester tests
        run: |
          Write-Host "=== PESTER TESTS ==="

          Set-Location $env:GITHUB_WORKSPACE

          $pester = Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester -or $pester.Version.Major -lt 5) {
            Write-Host "[INFO] Pester 5.x не знайдено, встановлюю локально для CurrentUser..."
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0.0
          }

          Import-Module Pester -MinimumVersion 5.0.0 -Force

          $result = Invoke-Pester -Path ".\tests" -PassThru

          if ($result.FailedCount -gt 0) {
            throw "Pester: $($result.FailedCount) тест(ів) провалено з $($result.TotalCount)."
          }

          Write-Host "[OK] Pester: усі $($result.PassedCount) тестів пройдено"

      - name: Quick runtime test
        run: |
          Write-Host "=== QUICK RUNTIME TEST ==="

          Set-Location $env:GITHUB_WORKSPACE

          $reportsDir = Join-Path $env:GITHUB_WORKSPACE "reports\ci-quick"

          if (Test-Path -LiteralPath $reportsDir) {
            Remove-Item -LiteralPath $reportsDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $reportsDir -Force | Out-Null

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\dist\Get-BravoSystemReport.ps1" -Profile Quick -NoPause -NoOpenFolder -OutputPath $reportsDir

          if ($LASTEXITCODE -ne 0) {
            throw "Quick runtime test failed with code $LASTEXITCODE"
          }

          Write-Host "[OK] Quick runtime test passed"
          Write-Host "[INFO] Reports dir: $reportsDir"

      - name: Validate latest JSON
        run: |
          Write-Host "=== JSON VALIDATION ==="

          Set-Location $env:GITHUB_WORKSPACE

          $reportsDir = Join-Path $env:GITHUB_WORKSPACE "reports\ci-quick"

          if (-not (Test-Path -LiteralPath $reportsDir)) {
            throw "Reports directory not found: $reportsDir"
          }

          $latestJson = Get-ChildItem -LiteralPath $reportsDir -Filter "BravoSystemReport_*.json" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $latestJson) {
            throw "No BravoSystemReport_*.json files found in $reportsDir"
          }

          $report = Get-Content -LiteralPath $latestJson.FullName -Raw -Encoding UTF8 | ConvertFrom-Json

          Write-Host "[INFO] JSON: $($latestJson.Name)"
          Write-Host "[INFO] SchemaVersion: $($report.SchemaVersion)"
          Write-Host "[INFO] ScriptVersion: $($report.ScriptVersion)"
          Write-Host "[INFO] Profile: $($report.Profile)"
          Write-Host "[INFO] Health: $($report.Health.Score)/100 $($report.Health.Status)"
          Write-Host "[INFO] OS: $($report.OS.Caption)"
          Write-Host "[INFO] CPU: $($report.Hardware.CPU.Cores) / $($report.Hardware.CPU.LogicalProcessors)"
          Write-Host "[INFO] RAM UsedPercent: $($report.Hardware.RAM.UsedPercent)"
          Write-Host "[INFO] Disk FreePercent: $($report.Hardware.Disks.FreePercent)"
          Write-Host "[INFO] PrimaryIPv4: $($report.Network.IP.PrimaryIPv4)"
          Write-Host "[INFO] PublicIPv4Status: $($report.Network.IP.PublicIPv4Status)"
          Write-Host "[INFO] Public IPv4 value is intentionally not printed."
          Write-Host "[INFO] CollectionErrors: $(@($report.CollectionErrors).Count)"

          if ($report.Profile -ne "Quick") {
            throw "Expected Profile=Quick, got Profile=$($report.Profile)"
          }

          if ([string]::IsNullOrWhiteSpace($report.OS.Caption)) {
            throw "OS.Caption is empty"
          }

          if (-not $report.Hardware.CPU.Cores) {
            throw "Hardware.CPU.Cores is empty"
          }

          if ($report.Hardware.RAM.UsedPercent -le 0 -or $report.Hardware.RAM.UsedPercent -gt 100) {
            throw "Hardware.RAM.UsedPercent is invalid: $($report.Hardware.RAM.UsedPercent)"
          }

          if ($report.Hardware.Disks.FreePercent -le 0 -or $report.Hardware.Disks.FreePercent -gt 100) {
            throw "Hardware.Disks.FreePercent is invalid: $($report.Hardware.Disks.FreePercent)"
          }

          if ([string]::IsNullOrWhiteSpace($report.Network.IP.PrimaryIPv4)) {
            throw "Network.IP.PrimaryIPv4 is empty"
          }

          if (@($report.CollectionErrors).Count -ne 0) {
            throw "Expected CollectionErrors=0, got CollectionErrors=$(@($report.CollectionErrors).Count)"
          }

          Write-Host "[OK] JSON validation passed"

      - name: Full runtime test
        run: |
          Write-Host "=== FULL RUNTIME TEST ==="

          Set-Location $env:GITHUB_WORKSPACE

          $reportsDir = Join-Path $env:GITHUB_WORKSPACE "reports\ci-full"

          if (Test-Path -LiteralPath $reportsDir) {
            Remove-Item -LiteralPath $reportsDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $reportsDir -Force | Out-Null

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\dist\Get-BravoSystemReport.ps1" -Profile Full -NoPause -NoOpenFolder -OutputPath $reportsDir

          if ($LASTEXITCODE -ne 0) {
            throw "Full runtime test failed with code $LASTEXITCODE"
          }

          Write-Host "[OK] Full runtime test passed"
          Write-Host "[INFO] Reports dir: $reportsDir"

      - name: Validate updates section
        run: |
          Write-Host "=== UPDATES SECTION VALIDATION ==="

          Set-Location $env:GITHUB_WORKSPACE

          $reportsDir = Join-Path $env:GITHUB_WORKSPACE "reports\ci-full"

          if (-not (Test-Path -LiteralPath $reportsDir)) {
            throw "Reports directory not found: $reportsDir"
          }

          $latestJson = Get-ChildItem -LiteralPath $reportsDir -Filter "BravoSystemReport_*.json" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $latestJson) {
            throw "No BravoSystemReport_*.json files found in $reportsDir"
          }

          $report = Get-Content -LiteralPath $latestJson.FullName -Raw -Encoding UTF8 | ConvertFrom-Json

          Write-Host "[INFO] JSON: $($latestJson.Name)"
          Write-Host "[INFO] Profile: $($report.Profile)"
          Write-Host "[INFO] OS FullBuild: $($report.Updates.OS.FullBuild)"
          Write-Host "[INFO] OS SupportStatus: $($report.Updates.OS.SupportStatus)"
          Write-Host "[INFO] Search Status: $($report.Updates.Search.Status)"
          Write-Host "[INFO] Search DurationSeconds: $($report.Updates.Search.DurationSeconds)"
          Write-Host "[INFO] Pending Total: $($report.Updates.Pending.Total)"
          Write-Host "[INFO] Pending Security: $($report.Updates.Pending.Security)"
          Write-Host "[INFO] PendingReboot Required: $($report.Updates.PendingReboot.Required)"
          Write-Host "[INFO] Installed Total: $($report.Updates.Installed.Total)"

          if ($report.Profile -ne "Full") {
            throw "Expected Profile=Full, got Profile=$($report.Profile)"
          }

          if (-not $report.Updates) {
            throw "Updates section is missing in JSON report"
          }

          $allowedSearchStatus = @("OK", "Failed", "Timeout")

          if ($allowedSearchStatus -notcontains $report.Updates.Search.Status) {
            throw "Unexpected Updates.Search.Status: $($report.Updates.Search.Status)"
          }

          if ([string]::IsNullOrWhiteSpace($report.Updates.OS.FullBuild)) {
            throw "Updates.OS.FullBuild is empty"
          }

          if ([int]$report.Updates.Installed.Total -le 0) {
            throw "Updates.Installed.Total is invalid: $($report.Updates.Installed.Total)"
          }

          if ($report.Updates.Search.Status -ne "OK") {
            Write-Host "[INFO] Search Error: $($report.Updates.Search.Error)"

            if ([int]$report.Updates.Pending.Total -ne 0) {
              throw "Inconsistent state: Search.Status=$($report.Updates.Search.Status) but Pending.Total=$($report.Updates.Pending.Total)"
            }
          }

          if (@($report.CollectionErrors).Count -ne 0) {
            $report.CollectionErrors | ForEach-Object { Write-Host "[INFO] CollectionError: $($_.Section): $($_.Message)" }
            throw "Expected CollectionErrors=0, got CollectionErrors=$(@($report.CollectionErrors).Count)"
          }

          Write-Host "[OK] Updates section validation passed"

      - name: Public IPv4 literal scan
        run: |
          Write-Host "=== PUBLIC IPv4 LITERAL SCAN ==="

          Set-Location $env:GITHUB_WORKSPACE

          $files = git ls-files

          $ipv4Regex = '\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'
          $hits = @()

          foreach ($file in $files) {
            if ($file -match '(^|/)reports(/|$)') {
              continue
            }

            if (-not (Test-Path -LiteralPath $file)) {
              continue
            }

            $content = Get-Content -LiteralPath $file -Raw -Encoding UTF8 -ErrorAction SilentlyContinue

            foreach ($match in [regex]::Matches($content, $ipv4Regex)) {
              $ip = $match.Value
              $octets = $ip.Split('.') | ForEach-Object { [int]$_ }

              $isPrivateOrSafe =
                ($octets[0] -eq 0) -or
                ($octets[0] -eq 10) -or
                ($octets[0] -eq 127) -or
                ($octets[0] -eq 169 -and $octets[1] -eq 254) -or
                ($octets[0] -eq 172 -and $octets[1] -ge 16 -and $octets[1] -le 31) -or
                ($octets[0] -eq 192 -and $octets[1] -eq 168) -or
                ($octets[0] -eq 100 -and $octets[1] -ge 64 -and $octets[1] -le 127) -or
                ($octets[0] -eq 198 -and ($octets[1] -eq 18 -or $octets[1] -eq 19)) -or
                ($octets[0] -eq 203 -and $octets[1] -eq 0 -and $octets[2] -eq 113)

              if (-not $isPrivateOrSafe) {
                $hits += [pscustomobject]@{
                  File = $file
                  IP   = $ip
                }
              }
            }
          }

          if ($hits.Count -gt 0) {
            $hits | Format-Table -AutoSize
            throw "Public IPv4 literal found in tracked files."
          }

          Write-Host "[OK] Public IPv4 literal scan passed"

      - name: Deep runtime test (CSV + Zip)
        run: |
          Write-Host "=== DEEP RUNTIME TEST (CSV + ZIP) ==="

          Set-Location $env:GITHUB_WORKSPACE

          $reportsDir = Join-Path $env:GITHUB_WORKSPACE "reports\ci-deep"

          if (Test-Path -LiteralPath $reportsDir) {
            Remove-Item -LiteralPath $reportsDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $reportsDir -Force | Out-Null

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\dist\Get-BravoSystemReport.ps1" -Profile Deep -CSV -Zip -NoPause -NoOpenFolder -OutputPath $reportsDir

          if ($LASTEXITCODE -ne 0) {
            throw "Deep runtime test failed with code $LASTEXITCODE"
          }

          $latestJson = Get-ChildItem -LiteralPath $reportsDir -Filter "BravoSystemReport_*.json" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $latestCsv = Get-ChildItem -LiteralPath $reportsDir -Filter "BravoSystemReport_*.csv" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $latestZip = Get-ChildItem -LiteralPath $reportsDir -Filter "BravoSystemReport_*.zip" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $latestJson) { throw "No BravoSystemReport_*.json files found in $reportsDir" }
          if (-not $latestCsv) { throw "No BravoSystemReport_*.csv files found in $reportsDir (-CSV не спрацював)" }
          if (-not $latestZip) { throw "No BravoSystemReport_*.zip files found in $reportsDir (-Zip не спрацював)" }

          $report = Get-Content -LiteralPath $latestJson.FullName -Raw -Encoding UTF8 | ConvertFrom-Json

          Write-Host "[INFO] Profile: $($report.Profile)"
          Write-Host "[INFO] WindowsUpdate.SearchStatus: $($report.WindowsUpdate.SearchStatus)"
          Write-Host "[INFO] WindowsUpdate.PendingCount: $($report.WindowsUpdate.PendingCount)"
          Write-Host "[INFO] DotNet.LatestKnownVersion: $($report.DotNet.LatestKnownVersion)"

          if ($report.Profile -ne "Deep") {
            throw "Expected Profile=Deep, got Profile=$($report.Profile)"
          }

          if ($report.WindowsUpdate.SearchStatus -eq "Skipped") {
            throw "WindowsUpdate.SearchStatus=Skipped у профілі Deep — COM-пошук оновлень не мав пропускатись."
          }

          Write-Host "[OK] Deep runtime test (CSV + Zip) passed"

      - name: Exit code contract test (forced export error -> exit 1)
        run: |
          Write-Host "=== EXIT CODE CONTRACT TEST ==="

          Set-Location $env:GITHUB_WORKSPACE

          $reportsDir = Join-Path $env:GITHUB_WORKSPACE "reports\ci-exitcode"

          if (Test-Path -LiteralPath $reportsDir) {
            Remove-Item -LiteralPath $reportsDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $reportsDir -Force | Out-Null

          # Навмисно невалідний SMTP-сервер -> Export.Email додає ExportError,
          # не CollectionError (P0.4) -> exit code має бути 1, не 0 (P0.5).
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\dist\Get-BravoSystemReport.ps1" `
            -Profile Quick -NoZip -NoPause -NoOpenFolder `
            -EmailTo "test@example.com" -SmtpServer "nonexistent.invalid.smtp.local" `
            -OutputPath $reportsDir

          if ($LASTEXITCODE -ne 1) {
            throw "Expected exit code 1 (export error, no collection error), got $LASTEXITCODE"
          }

          $latestJson = Get-ChildItem -LiteralPath $reportsDir -Filter "BravoSystemReport_*.json" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latestJson) { throw "No BravoSystemReport_*.json files found in $reportsDir" }

          $report = Get-Content -LiteralPath $latestJson.FullName -Raw -Encoding UTF8 | ConvertFrom-Json

          Write-Host "[INFO] CollectionErrors: $(@($report.CollectionErrors).Count)"
          Write-Host "[INFO] ExportErrors: $(@($report.ExportErrors).Count)"

          if (@($report.CollectionErrors).Count -ne 0) {
            throw "Expected CollectionErrors=0 (export error must not leak into collection errors), got $(@($report.CollectionErrors).Count)"
          }

          if (@($report.ExportErrors).Count -eq 0) {
            throw "Expected ExportErrors>0 (forced SMTP failure must be captured), got 0"
          }

          Write-Host "[OK] Exit code contract test passed"