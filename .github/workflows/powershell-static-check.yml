name: Ручна перевірка PowerShell

on:
  workflow_dispatch:

jobs:
  repository-check:
    name: Ручна перевірка структури репозиторію
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Перевірити структуру репозиторію
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ПЕРЕВІРКА СТРУКТУРИ РЕПОЗИТОРІЮ ==="

          test -f "Get-BravoSystemReport.ps1"
          echo "[OK] Знайдено root wrapper"

          test -f "src/90-Main.ps1"
          echo "[OK] Знайдено модульний entrypoint src/90-Main.ps1"

          test -f "src/BRAVO.build.json"
          echo "[OK] Знайдено build-маніфест src/BRAVO.build.json"

          test -f "dist/Get-BravoSystemReport.ps1"
          echo "[OK] Знайдено зібраний runtime dist/Get-BravoSystemReport.ps1"

          test -f "README.md"
          echo "[OK] Знайдено README.md"

          test -f "CHANGELOG.md"
          echo "[OK] Знайдено CHANGELOG.md"

          echo "[SUCCESS] Структура репозиторію коректна"