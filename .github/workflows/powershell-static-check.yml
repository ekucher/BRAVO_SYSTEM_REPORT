name: PowerShell static check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'bravo/**'

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Перевірити структуру репозиторію
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ПЕРЕВІРКА СТРУКТУРИ РЕПОЗИТОРІЮ ==="

          test -f "Get-BravoSystemReport.ps1"
          echo "[OK] Знайдено root wrapper"

          test -f "src/Get-BravoSystemReport.ps1"
          echo "[OK] Знайдено основний PowerShell-скрипт"

          test -f "README.md"
          echo "[OK] Знайдено README.md"

          test -f "CHANGELOG.md"
          echo "[OK] Знайдено CHANGELOG.md"

          echo "[SUCCESS] Структура репозиторію коректна"